name: downloader-myversion-front
services:
  frontend:
    build: .
    restart: unless-stopped
    environment:
      PORT: 3001
      BACKEND_URL: ${BACKEND_URL:?Set BACKEND_URL in .env}
      WEB_API_TOKEN: ${WEB_API_TOKEN}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${FRONTEND_PORT:-3001}:3001"
